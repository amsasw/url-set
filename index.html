<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>URL Path Recorder</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="wrap"><section class="card">
<header><div><h1>URL Path Recorder</h1><p>多标签页监控 · 编号 001-100</p></div><span id="connection" class="badge offline">未连接扩展</span></header>
<div class="installbar"><a class="download" href="https://github.com/amsasw/url-set/archive/refs/heads/main.zip">下载 Edge 扩展 ZIP</a></div>
<div class="controls">
<label>监控编号</label>
<select id="monitorId"></select>
<label>起始网址</label>
<div class="row"><input id="startUrl" value="https://github.com"><button id="start">开始监控</button><button id="stop" class="secondary">停止全部</button></div>
</div>
<div class="statusbar"><span><i id="dot" class="dot"></i><span id="state">等待连接</span></span><span id="count">0 条记录</span></div>
<main id="list"><div class="empty">暂无监控</div></main>
<footer><button id="clear" class="danger">清空</button></footer>
</section></div>
<script src="./app.js"></script>
</body></html>
