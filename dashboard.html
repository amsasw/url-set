<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>URL Path Recorder</title><link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <header>
      <div><h1>URL Path Recorder</h1><p>锁定一个标签页，只记录 URL 变化和时间</p></div>
      <div id="badge" class="badge">未运行</div>
    </header>

    <section class="controls">
      <label>起始锁定网址</label>
      <div class="inputrow">
        <input id="startUrl" value="https://github.com" placeholder="https://github.com">
        <button id="start">开始记录</button>
        <button id="stop" class="secondary">停止</button>
      </div>
      <div class="note">点击“开始记录”后会新开一个标签页并锁定它。之后即使跳转到 OAuth、验证页或其他域名，只要仍在这个标签页里，都会记录。</div>
    </section>

    <section class="summary">
      <div><span id="dot" class="dot"></span><span id="state">等待开始</span></div>
      <div id="count">0 条记录</div>
    </section>

    <main id="list"><div class="empty">暂无记录</div></main>

    <footer>
      <button id="copy" class="secondary">复制全部</button>
      <button id="export" class="secondary">导出 TXT</button>
      <button id="clear" class="danger">清空</button>
    </footer>
  </div>
</div>
<script src="dashboard.js"></script>
</body>
</html>
