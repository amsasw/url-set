<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>URL Path Recorder - Web Demo</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#111827;background:#f5f7fb}
*{box-sizing:border-box}
body{margin:0}
.wrap{max-width:980px;margin:48px auto;padding:0 20px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 12px 36px rgba(0,0,0,.06);overflow:hidden}
.top{padding:24px 26px;border-bottom:1px solid #eef0f4;display:flex;justify-content:space-between;gap:20px;align-items:center}
h1{font-size:22px;margin:0 0 5px}.sub{color:#6b7280;font-size:13px}
.badge{font-size:12px;padding:6px 10px;border-radius:999px;background:#f3f4f6;color:#4b5563}
.controls{padding:22px 26px;border-bottom:1px solid #eef0f4}
label{font-size:13px;font-weight:600;display:block;margin-bottom:8px}
.row{display:flex;gap:10px}
input{flex:1;border:1px solid #d1d5db;border-radius:10px;padding:11px 13px;font-size:14px;outline:none}
input:focus{border-color:#111827}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:#111827;color:#fff}
button.secondary{background:#f3f4f6;color:#111827}
button.danger{background:#fff;color:#b91c1c;border:1px solid #fecaca}
.hint{font-size:12px;color:#6b7280;margin-top:10px}
.status{padding:14px 26px;background:#fafafa;border-bottom:1px solid #eef0f4;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:#9ca3af;display:inline-block;margin-right:7px}
.dot.on{background:#16a34a;box-shadow:0 0 0 4px rgba(22,163,74,.1)}
.list{padding:4px 26px 22px}
.item{display:grid;grid-template-columns:170px 1fr;gap:18px;padding:14px 0;border-bottom:1px solid #f0f1f4}
.time{font:12px Consolas,monospace;color:#6b7280}
.url{font:13px Consolas,monospace;word-break:break-all}
.empty{text-align:center;color:#9ca3af;padding:42px 0}
.footer{padding:16px 26px;display:flex;gap:10px;justify-content:flex-end}
@media(max-width:700px){.row{flex-direction:column}.item{grid-template-columns:1fr;gap:5px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top">
      <div><h1>URL Path Recorder</h1><div class="sub">锁定一个起始页面，只记录这个页面后续的 URL 变化和时间</div></div>
      <div class="badge">网页版界面演示</div>
    </div>
    <div class="controls">
      <label>起始锁定网址</label>
      <div class="row">
        <input id="startUrl" value="https://github.com" placeholder="例如 https://github.com">
        <button id="start">开始演示</button>
        <button id="stop" class="secondary">停止</button>
      </div>
      <div class="hint">注意：普通网页受浏览器安全限制，不能直接监控另一个网站地址栏。本页面用于演示界面；真实记录功能需要由 Edge 扩展后台完成。</div>
    </div>
    <div class="status">
      <div><span id="dot" class="dot"></span><span id="state">未开始</span></div>
      <div id="count">0 条</div>
    </div>
    <div id="list" class="list"><div class="empty">输入网址并点击“开始演示”</div></div>
    <div class="footer">
      <button id="copy" class="secondary">复制记录</button>
      <button id="clear" class="danger">清空</button>
    </div>
  </div>
</div>
<script>
const list = document.getElementById('list');
const dot = document.getElementById('dot');
const state = document.getElementById('state');
const count = document.getElementById('count');
let records = [], timers = [], running = false;
function fmt(d){
  const p=(n,w=2)=>String(n).padStart(w,'0');
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(),3)}`;
}
function render(){
  count.textContent = `${records.length} 条`;
  if(!records.length){ list.innerHTML='<div class="empty">暂无记录</div>'; return; }
  list.innerHTML = records.map(r=>`<div class="item"><div class="time">${r.time}</div><div class="url">${r.url.replaceAll('&','&amp;').replaceAll('<','&lt;')}</div></div>`).join('');
}
function add(url){ records.push({time:fmt(new Date()), url}); render(); }
document.getElementById('start').onclick=()=>{
  timers.forEach(clearTimeout); timers=[]; records=[]; running=true;
  dot.classList.add('on'); state.textContent='正在锁定记录';
  let u=document.getElementById('startUrl').value.trim();
  if(!/^https?:\/\//i.test(u)) u='https://'+u;
  const base=new URL(u);
  const seq=[
    u,
    `${base.origin}/login`,
    'https://github.com/session',
    `${base.origin}/?return_to=%2Fdashboard`,
    `${base.origin}/dashboard`
  ];
  seq.forEach((x,i)=>timers.push(setTimeout(()=>{if(running)add(x)}, i*650)));
};
document.getElementById('stop').onclick=()=>{
  running=false; timers.forEach(clearTimeout); dot.classList.remove('on'); state.textContent='已停止';
};
document.getElementById('clear').onclick=()=>{records=[];render()};
document.getElementById('copy').onclick=async()=>{
  const t=records.map(r=>`${r.time}  ${r.url}`).join('\n');
  await navigator.clipboard.writeText(t);
};
</script>
</body>
</html>
