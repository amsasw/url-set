<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>URL Path Recorder</title>
  <link rel="stylesheet" href="./style.css?v=0.7.0">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <h1>URL Path Recorder</h1>
        <p>多任务 URL 监控 · 编号 001-100</p>
      </div>
      <div class="version-stack">
        <span id="connection" class="badge offline">未连接扩展</span>
        <span id="versionBadge" class="version-badge">Web 0.7.0</span>
      </div>
    </header>

    <section id="compatWarning" class="warning hidden">
      当前扩展版本过旧。请下载并重新加载最新版扩展后刷新页面。
    </section>

    <section class="installbar">
      <div>
        <strong>Edge 扩展</strong>
        <span>推荐下载独立安装包，不再需要加载整个仓库。</span>
      </div>
      <div class="install-actions">
        <a class="download" href="https://github.com/amsasw/url-set/releases/download/edge-latest/URL-Path-Recorder-Edge.zip">下载最新版扩展</a>
        <a class="link-button" href="https://github.com/amsasw/url-set/releases">查看 Releases</a>
      </div>
    </section>

    <section class="create-panel">
      <div class="field id-field">
        <label for="monitorId">监控编号</label>
        <select id="monitorId"></select>
      </div>
      <div class="field name-field">
        <label for="monitorName">名称</label>
        <input id="monitorName" maxlength="80" placeholder="例如：AgentRouter 登录">
      </div>
      <div class="field url-field">
        <label for="startUrl">起始网址</label>
        <input id="startUrl" value="https://github.com" placeholder="https://example.com">
      </div>
      <div class="create-actions">
        <button id="start" class="primary">开始 / 重新启动</button>
      </div>
    </section>

    <section class="toolbar">
      <div class="toolbar-status">
        <span><i id="dot" class="dot"></i><span id="state">等待连接</span></span>
        <span id="count">0 条记录</span>
      </div>
      <div class="toolbar-actions">
        <input id="filter" class="filter" placeholder="筛选编号、名称或网址">
        <button id="exportAllMasked" class="secondary">导出全部（脱敏）</button>
        <button id="stopAll" class="secondary">停止全部</button>
        <button id="clearAll" class="danger">清空全部</button>
      </div>
    </section>

    <main id="list" class="monitor-list">
      <div class="empty">暂无监控</div>
    </main>

    <details class="diagnostics">
      <summary>诊断信息</summary>
      <div id="diagnosticsBody" class="diagnostics-grid">
        <span>连接状态</span><strong>等待检测</strong>
      </div>
    </details>
  </div>

  <script src="./app.js?v=0.7.0"></script>
</body>
</html>
